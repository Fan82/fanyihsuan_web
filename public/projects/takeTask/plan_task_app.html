<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Plan Task</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: #080810;
        font-family:
          -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }
      #app {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        background: #080810;
        position: relative;
      }
      .screen {
        display: none;
        flex-direction: column;
        min-height: 100vh;
      }
      .screen.active {
        display: flex;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 12px 6px;
        font-size: 12px;
        color: #fff;
        font-weight: 600;
        background: #080810;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .status-icons {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .home-header {
        padding: 12px 12px 0;
      }
      .home-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #2a2a3e;
        border: 1.5px solid #3a3a52;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c8c5e8;
        font-weight: 700;
        font-size: 13px;
      }
      .greeting-name {
        font-size: 15px;
        font-weight: 600;
        color: #e8e8f0;
      }
      .greeting-sub {
        font-size: 10px;
        color: #555;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        background: #12121e;
        border-radius: 10px;
        border: 0.5px solid #1e1e2e;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .icon-btn:hover {
        border-color: #2e2e42;
      }
      .stats-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .stat-card {
        background: #0e0e1a;
        border-radius: 10px;
        padding: 10px 12px;
        border: 0.5px solid #14142a;
      }
      .stat-num {
        font-size: 20px;
        font-weight: 500;
        color: #e0e0f0;
      }
      .stat-label {
        font-size: 10px;
        color: #555;
        margin-top: 1px;
      }
      .progress-card {
        background: #0e0e1a;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 18px;
        border: 0.5px solid #14142a;
      }
      .progress-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
      }
      .progress-label {
        font-size: 10px;
        color: #555;
      }
      .progress-val {
        font-size: 10px;
        color: #7c6fcd;
        font-weight: 600;
      }
      .ptrack {
        height: 3px;
        background: #1a1a2a;
        border-radius: 2px;
      }
      .pfill {
        height: 3px;
        background: #7c6fcd;
        border-radius: 2px;
        transition: width 0.4s;
      }
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .section-title {
        font-size: 15px;
        font-weight: 600;
        color: #888;
      }
      .add-btn {
        background: #7c6fcd;
        border: none;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 20px;
        cursor: pointer;
      }
      .add-btn:hover {
        background: #8f84d4;
      }

      /* TIMELINE */
      .tl-wrap {
        padding: 0 12px 140px;
      }
      .tl-inner {
        position: relative;
        padding-left: 52px;
      }
      .tl-axis {
        position: absolute;
        left: 20px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #14142a;
      }
      .tl-slot {
        position: relative;
        margin-bottom: 2px;
      }
      .tl-hour {
        position: absolute;
        left: 10px;
        top: 0px;
        font-size: 10px;
        color: #2a2a3a;
        width: 38px;
        text-align: right;
        white-space: nowrap;
      }
      .tl-hour.vis {
        color: #555;
      }
      .tl-node {
        position: absolute;
        left: -40px;
        top: 8px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #080810;
        border: 1.5px solid #1e1e2e;
        cursor: pointer;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      .tl-node.done {
        background: #12122a;
        border-color: #2a2870;
      }
      .tl-node.done::after {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #534ab7;
      }
      .tl-node.active {
        border-color: #7c6fcd;
        background: #1a1830;
      }
      .tl-node.active::after {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #7c6fcd;
      }
      .tl-card {
        border-radius: 0 12px 12px 0;
        padding: 14px 12px 10px 10px;
        cursor: pointer;
        transition: background 0.15s;
        border-left: 2px solid transparent;
        margin-bottom: 3px;
        position: relative;
      }
      .tl-card:hover {
        background: #0e0e1a;
      }
      .tl-card.done {
        border-left-color: #1e1e3a;
      }
      .tl-card.active {
        background: #10101e;
        border-left-color: #7c6fcd;
      }
      .tl-card.upcoming {
        border-left-color: #1a1a28;
      }
      .tl-card.imp-card {
        border-left-color: #5a2a1a !important;
      }
      .tl-card-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tl-card-title {
        font-size: 13px;
        font-weight: 500;
        color: #c8c5e8;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tl-card-title.done {
        text-decoration: line-through;
        color: #36365a;
        font-weight: 400;
      }
      .tl-card-dur {
        font-size: 10px;
        color: #444;
        white-space: nowrap;
      }
      .tl-card-dur.active {
        color: #7c6fcd;
      }
      .tl-card-meta {
        display: flex;
        gap: 5px;
        margin-top: 5px;
        flex-wrap: wrap;
      }
      .tag {
        font-size: 9px;
        padding: 2px 7px;
        border-radius: 4px;
        background: #12122a;
        color: #534ab7;
      }
      .tag.imp {
        background: #1a1215;
        color: #b05030;
      }
      .tag.now {
        background: #0e0e1a;
        color: #7c6fcd;
      }
      .tl-actions {
        display: none;
        gap: 6px;
        margin-top: 9px;
        flex-wrap: wrap;
      }
      .tl-card.expanded .tl-actions {
        display: flex;
      }
      .act-btn {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 0.5px solid #1e1e2e;
        background: transparent;
        color: #666;
        cursor: pointer;
      }
      .act-btn:hover {
        color: #aaa;
        border-color: #2e2e42;
      }
      .act-btn.complete {
        color: #2a6644;
      }
      .act-btn.complete:hover {
        color: #1d9e75;
      }
      .act-btn.danger {
        color: #7f2929;
      }
      .act-btn.danger:hover {
        color: #e24b4a;
      }
      .now-row {
        position: relative;
        height: 14px;
        margin: 4px 0;
        display: flex;
        align-items: center;
      }
      .now-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ef9f27;
        flex-shrink: 0;
        margin-left: -34px;
        z-index: 3;
      }
      .now-line {
        flex: 1;
        height: 0.5px;
        background: #ef9f27;
        opacity: 0.4;
        margin-left: 4px;
      }
      .now-lbl {
        font-size: 9px;
        color: #ef9f27;
        white-space: nowrap;
        margin-left: 5px;
      }
      .gap-pill {
        padding: 3px 0 5px;
        font-size: 10px;
        color: #222232;
        text-align: center;
      }
      .tl-empty {
        text-align: center;
        padding: 60px 0 20px;
        color: #333;
        font-size: 13px;
      }

      /* FAB */
      .fab {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        background: #7c6fcd;
        border: none;
        border-radius: 14px;
        padding: 13px 28px;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        z-index: 20;
        box-shadow: 0 8px 24px rgba(124, 111, 205, 0.35);
        width: calc(100% - 44px);
        max-width: 386px;
      }
      .fab:hover {
        background: #8f84d4;
      }

      /* TOAST */
      .toast {
        position: fixed;
        bottom: 95px;
        left: 50%;
        transform: translateX(-50%);
        background: #12122a;
        border: 0.5px solid #1e1e3a;
        color: #9e9bc8;
        font-size: 12px;
        padding: 9px 18px;
        border-radius: 20px;
        white-space: nowrap;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      .toast.show {
        opacity: 1;
      }

      /* MODAL */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 40;
        align-items: flex-end;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal {
        background: #0e0e1a;
        border-radius: 20px 20px 0 0;
        padding: 22px 20px 36px;
        width: 100%;
        border-top: 0.5px solid #1e1e2e;
        max-width: 430px;
        margin: 0 auto;
      }
      .modal-title {
        font-size: 15px;
        font-weight: 600;
        color: #c8c5e8;
        margin-bottom: 18px;
      }
      .form-row {
        margin-bottom: 13px;
      }
      .form-label {
        font-size: 10px;
        color: #555;
        margin-bottom: 5px;
        display: block;
      }
      .form-input {
        width: 100%;
        background: #080810;
        border: 0.5px solid #1e1e2e;
        border-radius: 10px;
        padding: 10px 12px;
        color: #c8c5e8;
        font-size: 14px;
        outline: none;
        font-family: inherit;
      }
      .form-input:focus {
        border-color: #7c6fcd;
      }
      .time-row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .time-row .form-input {
        flex: 1;
      }
      .time-sep {
        color: #444;
        font-size: 14px;
      }
      .form-textarea {
        resize: none;
        height: 58px;
      }
      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-top: 0.5px solid #14142a;
        border-bottom: 0.5px solid #14142a;
        margin-bottom: 18px;
      }
      .toggle-label {
        font-size: 13px;
        color: #888;
      }
      .toggle {
        width: 42px;
        height: 24px;
        background: #1a1a2a;
        border-radius: 12px;
        position: relative;
        cursor: pointer;
        border: none;
        transition: background 0.2s;
      }
      .toggle.on {
        background: #7c6fcd;
      }
      .toggle::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        background: #fff;
        border-radius: 50%;
        top: 3px;
        left: 3px;
        transition: left 0.2s;
      }
      .toggle.on::after {
        left: 21px;
      }
      .modal-btns {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 8px;
      }
      .done-btn {
        background: #7c6fcd;
        border: none;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 14px;
        border-radius: 12px;
        cursor: pointer;
      }
      .done-btn:hover {
        background: #8f84d4;
      }
      .cancel-btn {
        background: transparent;
        border: 0.5px solid #1e1e2e;
        color: #666;
        font-size: 15px;
        padding: 14px;
        border-radius: 12px;
        cursor: pointer;
      }
      .cancel-btn:hover {
        color: #aaa;
      }

      /* CAL / NOTIF screens */
      .scroll-content {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px 100px;
      }
      .scroll-content::-webkit-scrollbar {
        display: none;
      }
      .back-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding: 16px 22px 0;
      }
      .back-btn {
        background: none;
        border: none;
        color: #7c6fcd;
        font-size: 24px;
        cursor: pointer;
        line-height: 1;
        padding: 0 4px;
      }
      .screen-title {
        font-size: 18px;
        font-weight: 600;
        color: #e0e0f0;
      }
      .cal-tabs {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }
      .cal-tab {
        background: #12121e;
        border: 0.5px solid #1e1e2e;
        color: #666;
        font-size: 11px;
        padding: 4px 12px;
        border-radius: 20px;
        cursor: pointer;
      }
      .cal-tab.active {
        background: #7c6fcd;
        border-color: #7c6fcd;
        color: #fff;
        font-weight: 600;
      }
      .cal-card {
        background: #0e0e1a;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
        border: 0.5px solid #14142a;
      }
      .cal-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .cal-nav-btn {
        background: none;
        border: none;
        color: #555;
        font-size: 20px;
        cursor: pointer;
        padding: 0 8px;
      }
      .cal-nav-btn:hover {
        color: #aaa;
      }
      .cal-month-label {
        font-size: 14px;
        color: #c8c5e8;
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .cal-day-label {
        text-align: center;
        font-size: 10px;
        color: #555;
        padding: 4px 0;
      }
      .cal-day {
        text-align: center;
        padding: 6px 2px;
        border-radius: 50%;
        color: #e2e8f0;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .cal-day:hover {
        background: #1e1e2e;
      }
      .cal-day.today {
        background: #7c6fcd;
        color: #fff;
        font-weight: 700;
      }
      .cal-day.past {
        color: #333;
      }
      .cal-day.has-dot::after {
        content: "";
        display: block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #7c6fcd;
        margin: 2px auto 0;
      }
      .cal-day.today.has-dot::after {
        background: rgba(255, 255, 255, 0.6);
      }
      .week-strip {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
        justify-content: center;
      }
      .week-day {
        text-align: center;
        background: #0e0e1a;
        border-radius: 10px;
        padding: 9px 8px;
        min-width: 54px;
        cursor: pointer;
        border: 0.5px solid #14142a;
        transition: border-color 0.15s;
      }
      .week-day.selected {
        background: #1a1830;
        border-color: #3d3870;
      }
      .week-day-label {
        font-size: 10px;
        color: #555;
        margin-bottom: 3px;
      }
      .week-day-num {
        font-size: 14px;
        font-weight: 600;
        color: #c8c5e8;
      }
      .week-day-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #7c6fcd;
        margin: 4px auto 0;
      }
      .cal-date-label {
        font-size: 12px;
        color: #555;
        margin-bottom: 12px;
      }
      .notif-item {
        background: #0e0e1a;
        border-radius: 12px;
        padding: 13px 14px;
        margin-bottom: 8px;
        border: 0.5px solid #14142a;
      }
      .notif-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .notif-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-top: 5px;
        flex-shrink: 0;
      }
      .notif-text {
        font-size: 13px;
        color: #888;
        line-height: 1.5;
      }
      .notif-italic {
        font-style: italic;
        font-weight: 300;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- HOME -->
      <div id="screen-home" class="screen active">
        <div class="status-bar">
          <span id="time-home">15:41</span>
          <div class="status-icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
              <rect x="0" y="4" width="3" height="8" rx="1" />
              <rect x="4.5" y="2.5" width="3" height="9.5" rx="1" />
              <rect x="9" y="1" width="3" height="11" rx="1" />
              <rect
                x="13.5"
                y="0"
                width="2.5"
                height="12"
                rx="1"
                opacity=".4"
              />
            </svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
              <path
                d="M8 2C5 2 2.5 3.5 1 5.7L2.5 7.2C3.7 5.4 5.7 4.2 8 4.2 10.3 4.2 12.3 5.4 13.5 7.2L15 5.7C13.5 3.5 11 2 8 2Z"
              />
              <path
                d="M8 6C6.3 6 4.8 6.8 3.8 8.1L5.3 9.5C6 8.6 6.9 8 8 8 9.1 8 10 8.6 10.7 9.5L12.2 8.1C11.2 6.8 9.7 6 8 6Z"
              />
              <circle cx="8" cy="11" r="1.5" />
            </svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
              <rect
                x=".5"
                y=".5"
                width="21"
                height="11"
                rx="3.5"
                stroke="white"
                stroke-opacity=".35"
              />
              <rect x="2" y="2" width="17" height="8" rx="2" fill="white" />
            </svg>
          </div>
        </div>
        <div class="home-header">
          <div class="home-header-top">
            <div style="display: flex; align-items: center; gap: 10px">
              <div class="avatar">VC</div>
              <div>
                <div class="greeting-sub">Hello</div>
                <div class="greeting-name">Vivian Chen</div>
              </div>
            </div>
            <div style="display: flex; gap: 6px">
              <button class="icon-btn" id="btn-calendar" aria-label="Calendar">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <rect
                    x="1"
                    y="3"
                    width="14"
                    height="12"
                    rx="2"
                    stroke="#888"
                    stroke-width="1.2"
                  />
                  <path
                    d="M5 1v3M11 1v3M1 7h14"
                    stroke="#888"
                    stroke-width="1.2"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
              <button class="icon-btn" id="btn-bell" aria-label="Notifications">
                <svg width="16" height="16" viewBox="0 0 22 22" fill="none">
                  <path
                    d="M11 2C7.5 2 5 4.5 5 8V13L3 15V16H19V15L17 13V8C17 4.5 14.5 2 11 2Z"
                    stroke="#888"
                    stroke-width="1.5"
                  />
                  <path
                    d="M8.5 16.5C8.5 18 9.6 19 11 19 12.4 19 13.5 18 13.5 16.5"
                    stroke="#888"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                  <circle cx="16" cy="5" r="3" fill="#ef4444" />
                </svg>
              </button>
            </div>
          </div>
          <div class="stats-row">
            <div class="stat-card">
              <div class="stat-num" id="stat-done">0</div>
              <div class="stat-label">completed</div>
            </div>
            <div class="stat-card">
              <div class="stat-num" id="stat-left">0</div>
              <div class="stat-label">remaining</div>
            </div>
          </div>
          <div class="progress-card">
            <div class="progress-top">
              <span class="progress-label">Today's progress</span
              ><span class="progress-val" id="pct-label">0%</span>
            </div>
            <div class="ptrack">
              <div class="pfill" id="pfill" style="width: 0%"></div>
            </div>
          </div>
          <div class="section-header">
            <span class="section-title" id="home-date-label">Today</span>
            <button class="add-btn" id="btn-add">+ Add task</button>
          </div>
        </div>
        <div class="tl-wrap">
          <div class="tl-inner" id="timeline"><div class="tl-axis"></div></div>
          <div class="tl-empty" id="tl-empty" style="display: none">
            No tasks yet · tap + Add task
          </div>
        </div>
        <button class="fab" id="fab-add">+ Add task</button>
        <div class="toast" id="toast"></div>
        <div class="modal-overlay" id="modal">
          <div class="modal">
            <div class="modal-title" id="modal-title">New Task</div>
            <div class="form-row">
              <input
                class="form-input"
                id="f-title"
                placeholder="Task name..."
              />
            </div>
            <div class="form-row">
              <label class="form-label">Time</label>
              <div class="time-row">
                <input
                  class="form-input"
                  id="f-start"
                  type="time"
                  value="10:00"
                />
                <span class="time-sep">—</span>
                <input
                  class="form-input"
                  id="f-end"
                  type="time"
                  value="11:00"
                />
              </div>
            </div>
            <div class="form-row">
              <label class="form-label">Note</label
              ><textarea
                class="form-input form-textarea"
                id="f-note"
                placeholder="Add a note..."
              ></textarea>
            </div>
            <div class="toggle-row">
              <span class="toggle-label">Mark as important</span
              ><button class="toggle" id="f-imp" aria-pressed="false"></button>
            </div>
            <div class="modal-btns">
              <button class="cancel-btn" id="modal-cancel">Cancel</button>
              <button class="done-btn" id="modal-save">Done</button>
            </div>
          </div>
        </div>
      </div>

      <!-- CALENDAR -->
      <div id="screen-calendar" class="screen">
        <div class="status-bar">
          <span id="time-cal">15:41</span>
          <div class="status-icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
              <rect x="0" y="4" width="3" height="8" rx="1" />
              <rect x="4.5" y="2.5" width="3" height="9.5" rx="1" />
              <rect x="9" y="1" width="3" height="11" rx="1" />
            </svg>
          </div>
        </div>
        <div class="back-row">
          <button class="back-btn" id="cal-back">&#8249;</button>
          <span class="screen-title">Calendar</span>
          <div class="cal-tabs">
            <button class="cal-tab" id="cal-monthly-btn">Monthly</button>
            <button class="cal-tab active" id="cal-weekly-btn">Weekly</button>
          </div>
        </div>
        <div class="scroll-content">
          <div id="cal-monthly-view" style="display: none">
            <div class="cal-card">
              <div class="cal-nav">
                <button class="cal-nav-btn" id="cal-prev">&#8249;</button>
                <span class="cal-month-label" id="cal-month-label"
                  >October 2026</span
                >
                <button class="cal-nav-btn" id="cal-next">&#8250;</button>
              </div>
              <div class="cal-grid" id="cal-grid"></div>
            </div>
          </div>
          <div id="cal-weekly-view">
            <div class="week-strip" id="week-strip"></div>
          </div>
          <div class="cal-date-label" id="cal-date-label"></div>
          <div id="cal-tl-inner" style="position: relative; padding-left: 52px">
            <div
              style="
                position: absolute;
                left: 20px;
                top: 0;
                bottom: 0;
                width: 1px;
                background: #14142a;
              "
            ></div>
          </div>
          <div class="tl-empty" id="cal-tl-empty" style="display: none">
            No tasks for this day
          </div>
        </div>
      </div>

      <!-- NOTIFICATIONS -->
      <div id="screen-notify" class="screen">
        <div class="status-bar">
          <span id="time-notif">15:41</span>
          <div class="status-icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
              <rect x="0" y="4" width="3" height="8" rx="1" />
              <rect x="4.5" y="2.5" width="3" height="9.5" rx="1" />
              <rect x="9" y="1" width="3" height="11" rx="1" />
            </svg>
          </div>
        </div>
        <div class="back-row">
          <button class="back-btn" id="notif-back">&#8249;</button
          ><span class="screen-title">Notifications</span>
        </div>
        <div class="scroll-content" id="notif-list"></div>
      </div>
    </div>
    <script>
      const NOTIFS = [
        {
          id: 1,
          text: "Congratulations, you have completed the October 9 challenge",
          accent: "#7c6fcd",
        },
        {
          id: 2,
          text: "Congratulations, you have completed the October 8 challenge",
          accent: "#7c6fcd",
        },
        { id: 3, text: "October 7 Challenge Missed", accent: "#ef4444" },
        { id: 4, text: "October 6 Challenge Missed", accent: "#ef4444" },
        {
          id: 5,
          text: "Congratulations, you have completed the October 5 challenge",
          accent: "#7c6fcd",
        },
        {
          id: 6,
          text: "Congratulations, you have completed the October 4 challenge",
          accent: "#7c6fcd",
        },
        { id: 7, text: "October 3 Challenge Missed", accent: "#ef4444" },
        {
          id: 8,
          text: "Congratulations, you have completed the October 2 challenge",
          accent: "#7c6fcd",
        },
      ];
      const MN = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const DN = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
      ];
      const SK = "plantask_tl_v2";
      let tasks = JSON.parse(localStorage.getItem(SK) || "null") || [
        {
          id: 1,
          title: "Meeting with PM Team",
          start: "10:00",
          end: "11:30",
          note: "",
          important: false,
          done: true,
        },
        {
          id: 2,
          title: "First quarter meeting",
          start: "13:40",
          end: "15:30",
          note: "",
          important: true,
          done: true,
        },
        {
          id: 3,
          title: "Study",
          start: "16:00",
          end: "17:30",
          note: "Room 3",
          important: true,
          done: false,
        },
        {
          id: 4,
          title: "Dinner with mom",
          start: "19:00",
          end: "20:30",
          note: "",
          important: false,
          done: false,
        },
        {
          id: 5,
          title: "Exercise",
          start: "21:00",
          end: "21:30",
          note: "",
          important: false,
          done: false,
        },
      ];
      let nextId = tasks.length ? Math.max(...tasks.map((t) => t.id)) + 1 : 10;
      let openCardId = null,
        editId = null,
        impOn = false,
        calDayOffset = 0,
        calYear = 2026,
        calMonth = 9;

      function save() {
        try {
          localStorage.setItem(SK, JSON.stringify(tasks));
        } catch (e) {}
      }
      function toMin(t) {
        const [h, m] = t.split(":").map(Number);
        return h * 60 + m;
      }
      function fmt12(t) {
        if (!t) return "";
        const [h, m] = t.split(":").map(Number);
        return `${h % 12 || 12}:${String(m).padStart(2, "0")}${h >= 12 ? "pm" : "am"}`;
      }
      function durLabel(s, e) {
        const d = toMin(e) - toMin(s);
        if (d <= 0) return "";
        const h = Math.floor(d / 60),
          rm = d % 60;
        return rm ? (h ? h + "h " + rm + "m" : rm + "m") : h + "h";
      }
      function nowMin() {
        const n = new Date();
        return n.getHours() * 60 + n.getMinutes();
      }
      function getStatus(task, isToday) {
        if (task.done) return "done";
        if (!isToday) return "upcoming";
        const nm = nowMin(),
          s = toMin(task.start),
          e = toMin(task.end);
        if (nm >= s && nm <= e) return "active";
        return "upcoming";
      }

      function updateClocks() {
        const n = new Date();
        const t = `${String(n.getHours()).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}`;
        ["time-home", "time-cal", "time-notif"].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.textContent = t;
        });
      }
      updateClocks();
      setInterval(updateClocks, 15000);

      function buildTimeline(taskList, isToday, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML =
          '<div style="position:absolute;left:20px;top:0;bottom:0;width:1px;background:#14142a"></div>';
        const sorted = taskList
          .slice()
          .sort((a, b) => toMin(a.start) - toMin(b.start));
        if (!sorted.length) return false;
        const nm = isToday ? nowMin() : -1;
        let nowInserted = false;
        sorted.forEach((task, i) => {
          const status = getStatus(task, isToday);
          const s = toMin(task.start);
          const prev = sorted[i - 1];
          if (!nowInserted && nm >= 0 && nm < s) {
            nowInserted = true;
            const el = document.createElement("div");
            el.className = "now-row";
            const n = new Date();
            const nt = `${String(n.getHours()).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}`;
            el.innerHTML = `<div class="now-dot"></div><div class="now-line"></div><div class="now-lbl">${fmt12(nt)}</div>`;
            container.appendChild(el);
          }
          if (prev) {
            const gap = s - toMin(prev.end);
            if (gap >= 30) {
              const gp = document.createElement("div");
              gp.className = "gap-pill";
              gp.textContent =
                gap >= 60
                  ? `${Math.round(gap / 6) / 10}h free`
                  : `${gap}m free`;
              container.appendChild(gp);
            }
          }
          const showH =
            !prev || Math.floor(toMin(prev.start) / 60) !== Math.floor(s / 60);
          const impC = task.important ? " imp-card" : "";
          const expanded = openCardId === task.id ? " expanded" : "";
          const slot = document.createElement("div");
          slot.className = "tl-slot";
          slot.dataset.id = task.id;
          slot.innerHTML = `<div class="tl-hour${showH ? " vis" : ""}">${showH ? fmt12(task.start) : ""}</div><div class="tl-node ${status}" data-node="${task.id}"></div><div class="tl-card ${status}${impC}${expanded}" data-card="${task.id}"><div class="tl-card-top"><div class="tl-card-title${task.done ? " done" : ""}">${task.title}</div><div class="tl-card-dur${status === "active" ? " active" : ""}">${durLabel(task.start, task.end)}</div></div><div class="tl-card-meta">${task.note ? `<span class="tag">${task.note}</span>` : ""}${task.important ? '<span class="tag imp">important</span>' : ""}${status === "active" ? '<span class="tag now">now</span>' : ""}</div><div class="tl-actions"><button class="act-btn ${task.done ? "" : "complete"}" data-action="toggle" data-id="${task.id}">${task.done ? "Undo" : "Complete"}</button><button class="act-btn" data-action="edit" data-id="${task.id}">Edit</button><button class="act-btn" data-action="imp" data-id="${task.id}">${task.important ? "Unimportant" : "Important"}</button><button class="act-btn" data-action="dup" data-id="${task.id}">Duplicate</button><button class="act-btn danger" data-action="del" data-id="${task.id}">Delete</button></div></div>`;
          container.appendChild(slot);
        });
        if (!nowInserted && nm >= 0) {
          const el = document.createElement("div");
          el.className = "now-row";
          const n = new Date();
          const nt = `${String(n.getHours()).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}`;
          el.innerHTML = `<div class="now-dot"></div><div class="now-line"></div><div class="now-lbl">${fmt12(nt)}</div>`;
          container.appendChild(el);
        }
        return true;
      }

      function renderHome() {
        const done = tasks.filter((t) => t.done).length,
          left = tasks.length - done,
          pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
        document.getElementById("stat-done").textContent = done;
        document.getElementById("stat-left").textContent = left;
        document.getElementById("pct-label").textContent = pct + "%";
        document.getElementById("pfill").style.width = pct + "%";
        const today = new Date();
        document.getElementById("home-date-label").textContent =
          `${DN[today.getDay()]}, ${MN[today.getMonth()]} ${today.getDate()}`;
        const has = buildTimeline(tasks, true, "timeline");
        document.getElementById("tl-empty").style.display = has
          ? "none"
          : "block";
      }

      document.getElementById("timeline").addEventListener("click", (e) => {
        const node = e.target.closest("[data-node]");
        if (node) {
          const id = parseInt(node.dataset.node);
          const t = tasks.find((t) => t.id === id);
          if (t) {
            t.done = !t.done;
            openCardId = null;
            save();
            renderHome();
            toast(t.done ? "Completed ✓" : "Marked active");
          }
          return;
        }
        const btn = e.target.closest("[data-action]");
        if (btn) {
          const id = parseInt(btn.dataset.id),
            act = btn.dataset.action;
          openCardId = null;
          if (act === "toggle") {
            const t = tasks.find((t) => t.id === id);
            if (t) {
              t.done = !t.done;
              save();
              renderHome();
              toast(t.done ? "Completed ✓" : "Marked active");
            }
          } else if (act === "del") {
            tasks = tasks.filter((t) => t.id !== id);
            save();
            renderHome();
            toast("Deleted");
          } else if (act === "imp") {
            const t = tasks.find((t) => t.id === id);
            if (t) {
              t.important = !t.important;
              save();
              renderHome();
              toast(t.important ? "Marked important" : "Removed");
            }
          } else if (act === "dup") {
            const t = tasks.find((t) => t.id === id);
            if (t) {
              tasks.push({ ...t, id: nextId++, title: t.title + " (copy)" });
              save();
              renderHome();
              toast("Duplicated");
            }
          } else if (act === "edit") {
            openEdit(id);
          }
          return;
        }
        const card = e.target.closest("[data-card]");
        if (card) {
          const id = parseInt(card.dataset.card);
          openCardId = openCardId === id ? null : id;
          renderHome();
          return;
        }
        openCardId = null;
        renderHome();
      });

      const modal = document.getElementById("modal"),
        fTitle = document.getElementById("f-title"),
        fStart = document.getElementById("f-start"),
        fEnd = document.getElementById("f-end"),
        fNote = document.getElementById("f-note"),
        fImpBtn = document.getElementById("f-imp");
      fImpBtn.addEventListener("click", () => {
        impOn = !impOn;
        fImpBtn.className = "toggle" + (impOn ? " on" : "");
        fImpBtn.setAttribute("aria-pressed", String(impOn));
      });
      function openAddModal() {
        editId = null;
        document.getElementById("modal-title").textContent = "New Task";
        fTitle.value = "";
        fStart.value = "10:00";
        fEnd.value = "11:00";
        fNote.value = "";
        impOn = false;
        fImpBtn.className = "toggle";
        fImpBtn.setAttribute("aria-pressed", "false");
        modal.classList.add("open");
        setTimeout(() => fTitle.focus(), 100);
      }
      function openEdit(id) {
        const t = tasks.find((t) => t.id === id);
        if (!t) return;
        editId = id;
        document.getElementById("modal-title").textContent = "Edit Task";
        fTitle.value = t.title;
        fStart.value = t.start;
        fEnd.value = t.end;
        fNote.value = t.note;
        impOn = t.important;
        fImpBtn.className = "toggle" + (impOn ? " on" : "");
        fImpBtn.setAttribute("aria-pressed", String(impOn));
        modal.classList.add("open");
      }
      document
        .getElementById("btn-add")
        .addEventListener("click", openAddModal);
      document
        .getElementById("fab-add")
        .addEventListener("click", openAddModal);
      document.getElementById("modal-save").addEventListener("click", () => {
        const title = fTitle.value.trim();
        if (!title) {
          fTitle.style.borderColor = "#ef4444";
          fTitle.focus();
          return;
        }
        fTitle.style.borderColor = "";
        const isEdit = !!editId;
        const task = {
          id: editId || nextId++,
          title,
          start: fStart.value,
          end: fEnd.value,
          note: fNote.value.trim(),
          important: impOn,
          done: editId
            ? tasks.find((t) => t.id === editId)?.done || false
            : false,
        };
        if (editId) tasks = tasks.map((t) => (t.id === editId ? task : t));
        else tasks.push(task);
        editId = null;
        save();
        modal.classList.remove("open");
        renderHome();
        toast(isEdit ? "Updated" : "Task added");
      });
      document
        .getElementById("modal-cancel")
        .addEventListener("click", () => modal.classList.remove("open"));
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("open");
      });

      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }
      function goScreen(name) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById("screen-" + name).classList.add("active");
      }
      document.getElementById("btn-bell").addEventListener("click", () => {
        renderNotifs();
        goScreen("notify");
      });
      document.getElementById("btn-calendar").addEventListener("click", () => {
        renderCal();
        goScreen("calendar");
      });
      document
        .getElementById("notif-back")
        .addEventListener("click", () => goScreen("home"));
      document
        .getElementById("cal-back")
        .addEventListener("click", () => goScreen("home"));

      function renderNotifs() {
        document.getElementById("notif-list").innerHTML = NOTIFS.map(
          (n) =>
            `<div class="notif-item"><div class="notif-row"><div class="notif-dot" style="background:${n.accent}"></div><p class="notif-text">${n.text.replace(/(October \d+ [Cc]hallenge)/g, '<span class="notif-italic">$1</span>')}</p></div></div>`,
        ).join("");
      }

      document
        .getElementById("cal-monthly-btn")
        .addEventListener("click", () => {
          document.getElementById("cal-monthly-view").style.display = "block";
          document.getElementById("cal-weekly-view").style.display = "none";
          document.getElementById("cal-monthly-btn").classList.add("active");
          document.getElementById("cal-weekly-btn").classList.remove("active");
          renderMonthGrid();
        });
      document
        .getElementById("cal-weekly-btn")
        .addEventListener("click", () => {
          document.getElementById("cal-monthly-view").style.display = "none";
          document.getElementById("cal-weekly-view").style.display = "block";
          document.getElementById("cal-monthly-btn").classList.remove("active");
          document.getElementById("cal-weekly-btn").classList.add("active");
          renderWeekStrip();
        });
      document.getElementById("cal-prev").addEventListener("click", () => {
        calMonth--;
        if (calMonth < 0) {
          calMonth = 11;
          calYear--;
        }
        renderMonthGrid();
      });
      document.getElementById("cal-next").addEventListener("click", () => {
        calMonth++;
        if (calMonth > 11) {
          calMonth = 0;
          calYear++;
        }
        renderMonthGrid();
      });

      function renderMonthGrid() {
        document.getElementById("cal-month-label").textContent =
          `${MN[calMonth]} ${calYear}`;
        const first = new Date(calYear, calMonth, 1).getDay(),
          days = new Date(calYear, calMonth + 1, 0).getDate(),
          today = new Date(),
          isThisMonth =
            today.getMonth() === calMonth && today.getFullYear() === calYear,
          dotDays = [4, 9, 15, 22],
          grid = document.getElementById("cal-grid");
        const heads = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"]
          .map((d) => `<div class="cal-day-label">${d}</div>`)
          .join("");
        const blanks = Array(first).fill("<div></div>").join("");
        const cells = Array.from({ length: days }, (_, i) => {
          const d = i + 1,
            isToday = isThisMonth && d === today.getDate(),
            isPast = isThisMonth && d < today.getDate(),
            hasDot = dotDays.includes(d);
          return `<div class="cal-day${isToday ? " today" : ""}${isPast ? " past" : ""}${hasDot ? " has-dot" : ""}">${d}</div>`;
        }).join("");
        grid.innerHTML = heads + blanks + cells;
      }

      function renderWeekStrip() {
        const today = new Date();
        const strip = document.getElementById("week-strip");
        const days = [];
        for (let i = -2; i <= 2; i++) {
          const d = new Date(today);
          d.setDate(today.getDate() + i);
          days.push({ d, offset: i });
        }
        strip.innerHTML = days
          .map(({ d, offset }) => {
            const isSel = offset === calDayOffset;
            const lbl = d.toLocaleDateString("en-US", {
              month: "short",
              day: "numeric",
            });
            const dayN = d.toLocaleDateString("en-US", { weekday: "short" });
            return `<div class="week-day${isSel ? " selected" : ""}" data-offset="${offset}"><div class="week-day-label">${lbl}</div><div class="week-day-num">${dayN}</div>${isSel ? '<div class="week-day-dot"></div>' : ""}</div>`;
          })
          .join("");
        strip.querySelectorAll(".week-day").forEach((el) => {
          el.addEventListener("click", () => {
            calDayOffset = parseInt(el.dataset.offset);
            renderWeekStrip();
            renderCalTimeline();
          });
        });
      }

      function renderCalTimeline() {
        const today = new Date(),
          d = new Date(today);
        d.setDate(today.getDate() + calDayOffset);
        document.getElementById("cal-date-label").textContent =
          `${MN[d.getMonth()]} ${d.getDate()} · ${DN[d.getDay()]}`;
        const isToday = calDayOffset === 0;
        const has = buildTimeline(tasks, isToday, "cal-tl-inner");
        document.getElementById("cal-tl-empty").style.display = has
          ? "none"
          : "block";
      }
      function renderCal() {
        calDayOffset = 0;
        renderMonthGrid();
        renderWeekStrip();
        renderCalTimeline();
        document.getElementById("cal-monthly-view").style.display = "none";
        document.getElementById("cal-weekly-view").style.display = "block";
        document.getElementById("cal-monthly-btn").classList.remove("active");
        document.getElementById("cal-weekly-btn").classList.add("active");
      }

      renderHome();
    </script>
  </body>
</html>
